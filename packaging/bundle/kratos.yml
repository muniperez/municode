version: v1.3.1

dsn: ""

serve:
  public:
    base_url: http://kratos:4433/
    host: 0.0.0.0
    port: 4433
  admin:
    base_url: http://kratos:4434/
    host: 0.0.0.0
    port: 4434

identity:
  default_schema_id: user
  schemas:
    - id: user
      url: file:///etc/config/identity.schema.json

session:
  lifespan: 168h

selfservice:
  default_browser_return_url: https://localhost/
  allowed_return_urls: []
  methods:
    password:
      enabled: true
    # Compose derives the relying party from CONSOLE_HOSTNAME and CONSOLE_URL.
    passkey:
      enabled: true
      config:
        rp:
          display_name: Municode
          id: localhost
          origins:
            - https://localhost
  flows:
    error:
      ui_url: https://localhost/sign-in
    login:
      ui_url: https://localhost/sign-in
      lifespan: 10m
    settings:
      ui_url: https://localhost/settings/account
      privileged_session_max_age: 15m
      required_aal: highest_available
    recovery:
      enabled: false
      ui_url: https://localhost/recovery
      lifespan: 10m
    verification:
      enabled: false
    registration:
      enabled: false

log:
  leak_sensitive_values: false
  level: warning
