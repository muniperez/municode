name: municode-workspaces

x-installation-labels: &installation-labels
  com.municode.workspaces.installation-id: ${WORKSPACES_INSTALLATION_ID:?set WORKSPACES_INSTALLATION_ID}

x-runtime: &runtime
  image: ${WORKSPACES_DOTNET_IMAGE:?set WORKSPACES_DOTNET_IMAGE}
  entrypoint: ["/usr/bin/dotnet"]
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]

x-shared-environment: &shared-environment
  Database__Provider: Postgres
  Database__PasswordFile: /run/secrets/app-db-password
  ConnectionStrings__Workspaces: Host=postgres;Port=5432;Database=workspaces;Username=workspaces
  OpenBao__Address: https://openbao:8200
  OpenBao__MountPath: workspaces
  OpenBao__EnvironmentPrefix: production
  OpenBao__TokenFile: /run/workspaces-openbao/token
  OpenBao__CaCertificateFile: /run/secrets/openbao-ca.crt
  DevelopmentWorkspaces__ConfigurationFile: /etc/workspaces/workspaces.json
  DevelopmentWorkspaceGateway__Enabled: "true"
  DevelopmentWorkspaceGateway__GatewayDomain: ${WORKSPACES_GATEWAY_DOMAIN:?set WORKSPACES_GATEWAY_DOMAIN}
  DevelopmentWorkspaceGateway__ServiceCredentialFile: /run/secrets/workspace-gateway-credential
  DevelopmentWorkspaceGateway__RelayHost: 172.31.21.2
  DevelopmentWorkspaceGateway__MinimumRelayPort: "42000"
  DevelopmentWorkspaceGateway__MaximumRelayPort: "42999"
  DevelopmentWorkspaceWorker__ApiBaseUrl: ${API_URL:?set API_URL}
  DevelopmentWorkspaceWorker__RelayBindAddress: 172.31.21.2
  DevelopmentWorkspaceWorker__RelayLockFile: /var/lib/workspaces/relay.lock
  DevelopmentWorkspaceWorker__RelayMinimumPort: "42000"
  DevelopmentWorkspaceWorker__RelayMaximumPort: "42999"

services:
  postgres:
    image: ${WORKSPACES_POSTGRES_IMAGE:?set WORKSPACES_POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-admin-password
    secrets:
      - postgres-admin-password
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [private]

  database-initialize:
    image: ${WORKSPACES_POSTGRES_IMAGE:?set WORKSPACES_POSTGRES_IMAGE}
    restart: "no"
    entrypoint: ["/bin/sh", "/opt/workspaces/init-databases.sh"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: postgres
      WORKSPACES_POSTGRES_ADMIN_PASSWORD_FILE: /run/secrets/postgres-admin-password
      WORKSPACES_APP_DB_PASSWORD_FILE: /run/secrets/app-db-password
      WORKSPACES_KRATOS_DB_PASSWORD_FILE: /run/secrets/kratos-db-password
    secrets:
      - postgres-admin-password
      - app-db-password
      - kratos-db-password
    volumes:
      - ./init-databases.sh:/opt/workspaces/init-databases.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]

  openbao:
    image: ${WORKSPACES_OPENBAO_IMAGE:?set WORKSPACES_OPENBAO_IMAGE}
    labels: *installation-labels
    restart: unless-stopped
    command: ["server", "-config=/etc/openbao/server.hcl"]
    environment:
      BAO_SKIP_DROP_ROOT: "true"
      SKIP_CHOWN: "true"
    secrets:
      - openbao-server.crt
      - openbao-server.key
      - openbao-ca.crt
    volumes:
      - openbao:/openbao/data
      - ./openbao.hcl:/etc/openbao/server.hcl:ro
    healthcheck:
      test:
        - CMD
        - bao
        - status
        - -address=https://openbao:8200
        - -ca-cert=/run/secrets/openbao-ca.crt
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [private]

  openbao-configure:
    profiles: ["maintenance"]
    image: ${WORKSPACES_OPENBAO_IMAGE:?set WORKSPACES_OPENBAO_IMAGE}
    restart: "no"
    entrypoint: ["/bin/sh", "/opt/workspaces/openbao-init.sh"]
    environment:
      BAO_ADDR: https://openbao:8200
      BAO_CACERT: /run/secrets/openbao-ca.crt
      OPENBAO_POLICY_FILE: /etc/openbao/workspaces-policy.hcl
      OPENBAO_ROOT_TOKEN_FILE: /run/openbao-root/token
      OPENBAO_ROLE_ID_FILE: /run/openbao-approle/role-id
      OPENBAO_SECRET_ID_FILE: /run/openbao-approle/secret-id
    secrets:
      - openbao-ca.crt
    volumes:
      - ./openbao-init.sh:/opt/workspaces/openbao-init.sh:ro
      - ./openbao-policy.hcl:/etc/openbao/workspaces-policy.hcl:ro
      - type: bind
        source: ${OPENBAO_ROOT_TOKEN_FILE:-/dev/null}
        target: /run/openbao-root/token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${WORKSPACES_SECRETS_DIR:?set WORKSPACES_SECRETS_DIR}/openbao-approle
        target: /run/openbao-approle
        bind:
          create_host_path: false
    depends_on:
      openbao:
        condition: service_healthy
    networks: [private]

  openbao-agent:
    image: ${WORKSPACES_OPENBAO_IMAGE:?set WORKSPACES_OPENBAO_IMAGE}
    labels: *installation-labels
    restart: unless-stopped
    command: ["agent", "-config=/etc/openbao/agent.hcl"]
    environment:
      BAO_SKIP_DROP_ROOT: "true"
      SKIP_CHOWN: "true"
    secrets:
      - openbao-role-id
      - openbao-secret-id
      - openbao-ca.crt
    volumes:
      - ./openbao-agent.hcl:/etc/openbao/agent.hcl:ro
      - ./openbao-ready.sh:/opt/workspaces/openbao-ready.sh:ro
      - openbao-agent-token:/run/workspaces-openbao
    depends_on:
      openbao:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/sh", "/opt/workspaces/openbao-ready.sh"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks: [private]

  kratos-migrate:
    image: ${WORKSPACES_KRATOS_IMAGE:?set WORKSPACES_KRATOS_IMAGE}
    user: "0:0"
    restart: "no"
    command: ["migrate", "sql", "-e", "--yes", "--config", "/etc/config/kratos.yml"]
    environment: &kratos-environment
      SELFSERVICE_DEFAULT_BROWSER_RETURN_URL: ${CONSOLE_URL:?set CONSOLE_URL}/
      SELFSERVICE_ALLOWED_RETURN_URLS: ${CONSOLE_URL:?set CONSOLE_URL}
      SELFSERVICE_FLOWS_ERROR_UI_URL: ${CONSOLE_URL:?set CONSOLE_URL}/sign-in
      SELFSERVICE_FLOWS_LOGIN_UI_URL: ${CONSOLE_URL:?set CONSOLE_URL}/sign-in
      SELFSERVICE_FLOWS_SETTINGS_UI_URL: ${CONSOLE_URL:?set CONSOLE_URL}/settings/account
      SELFSERVICE_METHODS_PASSKEY_ENABLED: ${WORKSPACES_PASSKEYS_ENABLED:-true}
      SELFSERVICE_METHODS_PASSKEY_CONFIG_RP_ID: ${CONSOLE_HOSTNAME:?set CONSOLE_HOSTNAME}
      SELFSERVICE_METHODS_PASSKEY_CONFIG_RP_ORIGINS: ${CONSOLE_URL:?set CONSOLE_URL}
    env_file:
      - ${WORKSPACES_SECRETS_DIR:?set WORKSPACES_SECRETS_DIR}/kratos.env
    volumes:
      - ./kratos.yml:/etc/config/kratos.yml:ro
      - ./identity.schema.json:/etc/config/identity.schema.json:ro
    depends_on:
      database-initialize:
        condition: service_completed_successfully
    networks: [private]

  kratos:
    image: ${WORKSPACES_KRATOS_IMAGE:?set WORKSPACES_KRATOS_IMAGE}
    user: "0:0"
    restart: unless-stopped
    command: ["serve", "--config", "/etc/config/kratos.yml"]
    environment: *kratos-environment
    env_file:
      - ${WORKSPACES_SECRETS_DIR:?set WORKSPACES_SECRETS_DIR}/kratos.env
    volumes:
      - ./kratos.yml:/etc/config/kratos.yml:ro
      - ./identity.schema.json:/etc/config/identity.schema.json:ro
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4434/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [private]

  api-migrate:
    <<: *runtime
    restart: "no"
    command: ["/opt/workspaces/Municode.Api.dll", "migrate"]
    environment:
      <<: *shared-environment
    secrets:
      - app-db-password
    volumes:
      - ./runtime/api:/opt/workspaces:ro
      - ./workspaces.json:/etc/workspaces/workspaces.json:ro
    depends_on:
      database-initialize:
        condition: service_completed_successfully
    networks: [private]

  api-bootstrap:
    <<: *runtime
    profiles: ["maintenance"]
    restart: "no"
    entrypoint: ["/usr/bin/dotnet", "/opt/workspaces/Municode.Api.dll", "bootstrap"]
    command: []
    environment:
      Database__Provider: Postgres
      Database__PasswordFile: /run/secrets/app-db-password
      ConnectionStrings__Workspaces: Host=postgres;Port=5432;Database=workspaces;Username=workspaces
      Kratos__AdminBaseUrl: http://kratos:4434/
      Bootstrap__InstallationId: ${WORKSPACES_INSTALLATION_ID:?set WORKSPACES_INSTALLATION_ID}
    secrets:
      - app-db-password
    volumes:
      - ./runtime/api:/opt/workspaces:ro
      - type: bind
        source: ${WORKSPACES_SECRETS_DIR:?set WORKSPACES_SECRETS_DIR}/bootstrap
        target: /run/workspaces-bootstrap
        bind:
          create_host_path: false
    networks: [private]

  api:
    <<: *runtime
    command: ["/opt/workspaces/Municode.Api.dll"]
    environment:
      <<: *shared-environment
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      Cors__AllowedOrigins__0: ${CONSOLE_URL:?set CONSOLE_URL}
      Console__BaseUrl: ${CONSOLE_URL:?set CONSOLE_URL}
      Kratos__PublicBaseUrl: http://kratos:4433/
      Kratos__AdminBaseUrl: http://kratos:4434/
      Kratos__DashboardOrigin: ${CONSOLE_URL:?set CONSOLE_URL}
      Kratos__PasskeyEnabled: ${WORKSPACES_PASSKEYS_ENABLED:-true}
      GitHub__ApiUrl: ${API_URL:?set API_URL}
      Bootstrap__InstallationId: ${WORKSPACES_INSTALLATION_ID:?set WORKSPACES_INSTALLATION_ID}
    secrets:
      - app-db-password
      - workspace-gateway-credential
      - openbao-ca.crt
    volumes:
      - ./runtime/api:/opt/workspaces:ro
      - ./workspaces.json:/etc/workspaces/workspaces.json:ro
      - openbao-agent-token:/run/workspaces-openbao:ro
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      kratos:
        condition: service_healthy
      openbao-agent:
        condition: service_healthy
    networks: [private]

  worker:
    <<: *runtime
    command: ["/opt/workspaces/Municode.Worker.dll"]
    environment:
      <<: *shared-environment
      WorkspaceSsh__PrivateKeyFile: /run/workspaces-ssh/worker-key
      WorkspaceSsh__PublicKey: ${WORKSPACES_WORKER_SSH_PUBLIC_KEY:?set WORKSPACES_WORKER_SSH_PUBLIC_KEY}
    secrets:
      - app-db-password
      - workspace-gateway-credential
      - openbao-ca.crt
    volumes:
      - ./runtime/worker:/opt/workspaces:ro
      - ./workspaces.json:/etc/workspaces/workspaces.json:ro
      - openbao-agent-token:/run/workspaces-openbao:ro
      - relay-state:/var/lib/workspaces
      - type: bind
        source: ${WORKSPACES_SECRETS_DIR:?set WORKSPACES_SECRETS_DIR}/ssh
        target: /run/workspaces-ssh
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      api:
        condition: service_started
      openbao-agent:
        condition: service_healthy
    networks:
      private: {}
      workspace-relay:
        ipv4_address: 172.31.21.2

  workspace-gateway:
    <<: *runtime
    command: ["/opt/workspaces/Municode.Gateway.dll"]
    environment:
      ASPNETCORE_URLS: http://+:8080
      DevelopmentWorkspaceGateway__Enabled: "true"
      DevelopmentWorkspaceGateway__GatewayDomain: ${WORKSPACES_GATEWAY_DOMAIN:?set WORKSPACES_GATEWAY_DOMAIN}
      DevelopmentWorkspaceGateway__ServiceCredentialFile: /run/secrets/workspace-gateway-credential
      DevelopmentWorkspaceGateway__ControlPlaneUrl: http://api:8080
      DevelopmentWorkspaceGateway__RelayHost: 172.31.21.2
      DevelopmentWorkspaceGateway__MinimumRelayPort: "42000"
      DevelopmentWorkspaceGateway__MaximumRelayPort: "42999"
      DevelopmentWorkspaceGateway__TrustedProxyAddress: 172.31.20.2
    secrets:
      - workspace-gateway-credential
    volumes:
      - ./runtime/gateway:/opt/workspaces:ro
    depends_on:
      api:
        condition: service_started
    networks:
      private: {}
      workspace-gateway-proxy:
        ipv4_address: 172.31.20.3
      workspace-relay:
        ipv4_address: 172.31.21.3

  caddy:
    image: ${WORKSPACES_CADDY_IMAGE:?set WORKSPACES_CADDY_IMAGE}
    restart: unless-stopped
    environment:
      API_HOSTNAME: ${API_HOSTNAME:?set API_HOSTNAME}
      CONSOLE_HOSTNAME: ${CONSOLE_HOSTNAME:?set CONSOLE_HOSTNAME}
      API_URL: ${API_URL:?set API_URL}
      WORKSPACES_SOURCE_URL: ${WORKSPACES_SOURCE_URL:-https://github.com/muniperez/municode}
      WORKSPACES_GATEWAY_DOMAIN: ${WORKSPACES_GATEWAY_DOMAIN:?set WORKSPACES_GATEWAY_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./dashboard:/srv/workspaces-dashboard:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_started
      workspace-gateway:
        condition: service_started
    networks:
      private: {}
      workspace-gateway-proxy:
        ipv4_address: 172.31.20.2

secrets:
  postgres-admin-password:
    file: ${WORKSPACES_SECRETS_DIR:?set WORKSPACES_SECRETS_DIR}/postgres-admin-password
  app-db-password:
    file: ${WORKSPACES_SECRETS_DIR:?set WORKSPACES_SECRETS_DIR}/app-db-password
  kratos-db-password:
    file: ${WORKSPACES_SECRETS_DIR:?set WORKSPACES_SECRETS_DIR}/kratos-db-password
  workspace-gateway-credential:
    file: ${WORKSPACES_SECRETS_DIR:?set WORKSPACES_SECRETS_DIR}/workspace-gateway-credential
  openbao-role-id:
    file: ${WORKSPACES_SECRETS_DIR:?set WORKSPACES_SECRETS_DIR}/openbao-approle/role-id
  openbao-secret-id:
    file: ${WORKSPACES_SECRETS_DIR:?set WORKSPACES_SECRETS_DIR}/openbao-approle/secret-id
  openbao-server.crt:
    file: ${WORKSPACES_SECRETS_DIR:?set WORKSPACES_SECRETS_DIR}/openbao-server.crt
  openbao-server.key:
    file: ${WORKSPACES_SECRETS_DIR:?set WORKSPACES_SECRETS_DIR}/openbao-server.key
  openbao-ca.crt:
    file: ${WORKSPACES_SECRETS_DIR:?set WORKSPACES_SECRETS_DIR}/openbao-ca.crt

volumes:
  postgres:
    labels: *installation-labels
  openbao:
    labels: *installation-labels
  openbao-agent-token:
    labels: *installation-labels
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,mode=0750
  relay-state:
    labels: *installation-labels
  caddy-data:
    labels: *installation-labels
  caddy-config:
    labels: *installation-labels

networks:
  private:
    labels: *installation-labels
    driver: bridge
  workspace-gateway-proxy:
    labels: *installation-labels
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.20.0/24
  workspace-relay:
    labels: *installation-labels
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.21.0/24
