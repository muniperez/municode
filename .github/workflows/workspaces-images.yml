name: Workspaces images

on:
  pull_request:
    paths:
      - .github/workflows/workspaces-images.yml
      - src/Workspaces.Api/**
      - src/Workspaces.Worker/**
      - src/Workspaces.Gateway/**
      - src/Workspaces.Common/**
  push:
    tags:
      - workspaces-v*

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'muniperez/municode' && startsWith(github.ref, 'refs/tags/workspaces-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: amd64,arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish immutable component images
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#workspaces-v}"
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --file src/Workspaces.Api/Dockerfile \
            --tag "ghcr.io/muniperez/municode-api:$version" .
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --file src/Workspaces.Worker/Dockerfile \
            --tag "ghcr.io/muniperez/municode-workspaces-worker:$version" .
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --file src/Workspaces.Gateway/Dockerfile \
            --tag "ghcr.io/muniperez/municode-workspaces-gateway:$version" .

  contracts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          test -f src/Workspaces.Api/Dockerfile
          test -f src/Workspaces.Worker/Dockerfile
          test -f src/Workspaces.Gateway/Dockerfile
