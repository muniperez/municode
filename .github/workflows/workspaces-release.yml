name: Workspaces release

on:
  pull_request:
    paths:
      - .github/workflows/workspaces-release.yml
      - packaging/**
      - scripts/delivery/**
      - docs/operator.md
      - docs/user.md
  push:
    tags:
      - workspaces-v*

permissions:
  contents: read

concurrency:
  group: workspaces-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify release contracts
        run: |
          git check-ignore .local/artifacts/probe
          python3 -B -m unittest discover -s scripts/delivery -p 'test_*.py' -v
          secrets="$PWD/.local/artifacts/compose-smoke/secrets"
          mkdir -p "$secrets/ssh" "$secrets/bootstrap" "$secrets/openbao-approle"
          for file in postgres-admin-password app-db-password kratos-db-password \
              workspace-gateway-credential ssh/worker-key openbao-server.crt \
              openbao-server.key openbao-ca.crt \
              openbao-approle/role-id openbao-approle/secret-id; do
            printf '%s\n' synthetic > "$secrets/$file"
          done
          printf '%s\n' \
            'DSN=postgres://kratos:synthetic@postgres:5432/kratos?sslmode=disable' \
            'SECRETS_COOKIE=synthetic' \
            'SECRETS_CIPHER=synthetic' > "$secrets/kratos.env"
          WORKSPACES_SECRETS_DIR="$secrets" docker compose \
            -f packaging/bundle/compose.yml \
            --env-file packaging/bundle/.env.example config --quiet

  publish:
    if: github.repository == 'muniperez/municode' && startsWith(github.ref, 'refs/tags/workspaces-v')
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: workspaces-release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      SOURCE_REVISION: ${{ github.sha }}
      OUTPUT: ${{ github.workspace }}/.local/artifacts/release
      PAYLOAD: ${{ github.workspace }}/.local/artifacts/release-payload
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Gate an exact source and complete client handoff
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^workspaces-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          test -f src/Workspaces.Dashboard/package.json
          test -f src/Workspaces.Dashboard/package-lock.json
          test -f src/Workspaces.Cli/Workspaces.Cli.csproj
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release tags and assets are immutable."
            exit 1
          fi
      - name: Publish API worker and gateway
        run: |
          mkdir -p "$PAYLOAD"
          dotnet publish src/Workspaces.Api -c Release -o "$PAYLOAD/api"
          dotnet publish src/Workspaces.Worker -c Release -o "$PAYLOAD/worker"
          dotnet publish src/Workspaces.Gateway -c Release -o "$PAYLOAD/gateway"
      - name: Build the expected dashboard static target
        run: |
          npm ci --prefix src/Workspaces.Dashboard
          npm run build --prefix src/Workspaces.Dashboard
          cp -R src/Workspaces.Dashboard/dist "$PAYLOAD/dashboard"
      - name: Publish the expected CLI targets
        run: |
          for rid in linux-x64 linux-arm64 osx-arm64 win-x64; do
            suffix=
            [ "$rid" = win-x64 ] && suffix=.exe
            dotnet publish src/Workspaces.Cli/Workspaces.Cli.csproj -c Release \
              --runtime "$rid" --self-contained true \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false \
              -o "$PAYLOAD/cli/$rid"
            test -f "$PAYLOAD/cli/$rid/Workspaces.Cli$suffix"
            mv "$PAYLOAD/cli/$rid/Workspaces.Cli$suffix" "$PAYLOAD/cli/$rid/workspaces$suffix"
          done
      - name: Assemble independent release
        run: |
          python3 -B scripts/delivery/package.py \
            --version "${RELEASE_TAG#workspaces-v}" --source "$SOURCE_REVISION" --rid linux-any \
            --api "$PAYLOAD/api" --worker "$PAYLOAD/worker" --gateway "$PAYLOAD/gateway" \
            --dashboard "$PAYLOAD/dashboard" --cli "$PAYLOAD/cli" --output "$OUTPUT"
      - name: Verify packaged inventory
        run: |
          cd "$OUTPUT"
          sha256sum --check --strict checksums.txt
          tar -tzf "municode-workspaces-${RELEASE_TAG#workspaces-v}-linux-any.tar.gz" |
            grep -E '/(runtime/(api|worker|gateway)|dashboard|cli)/'
      - name: Publish exact release assets
        run: |
          prerelease=()
          if [[ "${RELEASE_TAG#workspaces-v}" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" "$OUTPUT"/* \
            --repo muniperez/municode --verify-tag --latest=false \
            --title "Municode Workspaces ${RELEASE_TAG#workspaces-v}" \
            --notes-file packaging/bundle/release-notes.md "${prerelease[@]}"
