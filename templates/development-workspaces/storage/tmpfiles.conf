# Workspaces scratch tier on the VM's local disk, never under /workspace. Created at every boot by
# systemd-tmpfiles-setup.service (before sysinit.target, so before workspaces-t3.service) and
# re-applied by storage_tiers.py before each T3 start. tmp is emptied at boot; the rest is kept
# across reboots but may be empty after any VM replacement.
d /var/lib/workspaces-scratch 0755 root root -
d /var/lib/workspaces-scratch/cache 0700 coding coding -
D /var/lib/workspaces-scratch/tmp 0700 coding coding -
d /var/lib/workspaces-scratch/docker 0711 root root -
d /var/lib/workspaces-scratch/repos 0700 root root -
